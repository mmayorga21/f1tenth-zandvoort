# Definición del escenario; no es un archivo de parámetros ROS.
schema_version: 1
scenario: original
runtime_ready: true
baseline_tag: parte-1-finalizada

base_files:
  simulator: src/f1tenth_gym_ros/config/sim.yaml
  controller: src/f1tenth_controller/config/follow_the_gap.yaml
  lap_tracker: src/f1tenth_controller/config/lap_tracker.yaml
  map_image: src/f1tenth_gym_ros/maps/Zandvoort_map.png
  map_metadata: src/f1tenth_gym_ros/maps/Zandvoort_map.yaml

vehicles:
  - id: ego_racecar
    algorithm: follow_the_gap
    start: simulator_ego_pose

obstacles:
  count: 0
  objects: []

acceptance:
  full_consecutive_laps_per_vehicle: 10
  collisions_allowed: 0
  pauses_allowed: false
  resets_during_attempt_allowed: false
  timing: simulation_clock
  lap_reference: each_vehicle_start_gate
  finish_when: all_vehicles_complete
  overtakes_required: 0

pending_implementation: []
